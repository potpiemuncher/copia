[package]
name = "copia"
version = "0.1.1"
description = "Your AI coding quotas, as little bars in the menubar / system tray"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
dirs = "7"
# Claude Code names a CLAUDE_CONFIG_DIR sign-in's Keychain item after a SHA-256.
sha2 = "0.10"

# Read the Claude Code Keychain item through Security.framework, so a macOS
# "Always Allow" trusts Copia's own binary rather than /usr/bin/security.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", default-features = false, features = ["OSX_10_12"] }

# getuid(), to check who owns config.json before running its commands.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
